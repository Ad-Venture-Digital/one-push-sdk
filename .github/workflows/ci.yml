# One Push SDK CI — K13: bu depo herkese açık, anahtar ve yapılandırma girmez.
# Gizli bilgi taraması ilk günden; derlemeler iOS (macOS runner) ve Android (JDK 17).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gizli-bilgi:
    name: Gizli bilgi taramasi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kalip taramasi
        run: |
          set -euo pipefail
          # Kaliplar One deposundaki ci-deploy.yml ile ayni ailede; kalibin kendisi dokümana yazilmaz.
          if grep -rInE '(AIza[0-9A-Za-z_-]{30,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|xox[abprs]-[0-9A-Za-z-]{10,}|"private_key_id"|ya29\.[0-9A-Za-z_-]{20,})' --exclude-dir=.git --exclude-dir=.build --exclude-dir=build . ; then
            echo "Gizli bilgi kalibi bulundu"; exit 1; fi
          echo "temiz"

  ios:
    name: iOS cekirdegi (swift build + checks)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Derle ve dogrulamalari kostur
        working-directory: ios
        run: |
          swift build
          swift run OnePushChecks

  android:
    name: Android cekirdegi (JUnit) + Firebase adaptoru
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Testler ve adaptor derlemesi
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :onepush:testDebugUnitTest :onepush-firebase:assembleDebug --no-daemon --console=plain
