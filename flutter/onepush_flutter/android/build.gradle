group 'com.adventure.onepush.flutter'
version '0.1.0'

buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
    }
}

allprojects { repositories { google(); mavenCentral() } }

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.adventure.onepush.flutter'
    compileSdk 34
    defaultConfig { minSdk 26 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // Çekirdek: Maven yayını depo açılınca; o güne kadar uygulama `:onepush` modülünü
    // settings'e include edip buradaki koordinatı project(':onepush') ile değiştirir.
    implementation 'com.adventure:onepush:0.1.0'
}
